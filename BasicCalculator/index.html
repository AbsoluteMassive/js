<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Basic Calculator</h1>
  <div id="container">
    <div class="calculator">
      <input id="first-number" type="number" placeholder="first value">
      <input id="second-number" type="number" placeholder="second value">
    </div>
    <div id="operations">
      <button onclick="calc('add')">+</button>
      <button onclick="calc('subtract')">-</button>
      <button onclick="calc('multiply')">x</button>
      <button onclick="calc('divide')">/</button>
    </div>
    <p>Result</p>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
